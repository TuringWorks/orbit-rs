# Orbit Multi-Protocol Server Configuration
# This configuration enables orbit-rs to natively serve as:
# - PostgreSQL server (port 5432) with full SQL and pgvector support
# - MySQL server (port 3306) for MySQL-compatible clients
# - CQL server (port 9042) for Cassandra-compatible clients
# - Redis server (port 6379) with vector operations and modules
# - gRPC server (port 50051) for actor system management
# - REST API server (port 8080) for web applications
# - Cypher server (port 7687) for Neo4j-compatible graph queries
# - OrbitQL server (port 8081) for native OrbitQL queries
# - AQL server (port 8529) for ArangoDB-compatible queries

[server]
# Unique node identifier (auto-generated if not provided)
node_id = "orbit-node-1"

# Bind address for all servers
bind_address = "0.0.0.0"

# Environment: "Development", "Testing", "Staging", "Production"
environment = "Production"

# Data and configuration directories
data_dir = "./data"
config_dir = "./config"

[actor_system]
# Maximum number of actors per node
max_actors = 10000

# Actor mailbox size
mailbox_size = 1000

# Supervision strategy: "OneForOne", "OneForAll", "RestForOne"
supervision_strategy = "OneForOne"

# Optional cluster configuration
# [actor_system.cluster]
# seed_nodes = ["node1.example.com:7946", "node2.example.com:7946"]
# gossip_port = 7946
# heartbeat_interval_ms = 5000
# failure_timeout_ms = 30000

# ================================
# PROTOCOL SERVER CONFIGURATIONS
# ================================

# gRPC Actor Management Server
[protocols.grpc]
enabled = true
port = 50051
max_concurrent_streams = 1000
max_message_size = 4194304  # 4MB

# PostgreSQL Wire Protocol Server
[protocols.postgresql]
enabled = true
port = 5432
max_connections = 1000
connection_timeout_secs = 30

# SQL Engine Configuration
[protocols.postgresql.sql_engine]
max_query_complexity = 1000
query_timeout_secs = 30
enable_optimization = true
enable_caching = true
cache_size_mb = 256

# Vector Operations for PostgreSQL
[protocols.postgresql.vector_ops]
default_metric = "cosine"
max_dimensions = 4096
batch_size = 1000
enable_simd = true

[protocols.postgresql.vector_ops.indexing]
default_algorithm = "hnsw"

[protocols.postgresql.vector_ops.indexing.hnsw]
m = 16
ef_construction = 200
ef_search = 50

[protocols.postgresql.vector_ops.indexing.ivf]
nlist = 100
nprobe = 10

# PostgreSQL-specific features
[protocols.postgresql.features]
enable_pgvector = true        # pgvector extension compatibility
enable_postgis = false        # PostGIS compatibility (future)
enable_json = true           # JSON/JSONB operations
enable_fulltext = true       # Full-text search
enable_prepared_statements = true
enable_transactions = true

# MySQL Wire Protocol Server
[protocols.mysql]
enabled = true
port = 3306
max_connections = 1000
connection_timeout_secs = 30
server_version = "8.0.0-Orbit"
authentication_enabled = false

# CQL (Cassandra Query Language) Server
[protocols.cql]
enabled = true
port = 9042
max_connections = 1000
connection_timeout_secs = 30
protocol_version = 4
authentication_enabled = false

# Redis RESP Protocol Server
[protocols.redis]
enabled = true
port = 6379
max_connections = 1000
connection_timeout_secs = 30

# Redis Command Configuration
[protocols.redis.commands]
enabled_groups = [
    "generic", "string", "list", "hash", "set", "zset",
    "vector", "search", "json", "graph", "stream", "pubsub"
]
disabled_commands = []
command_timeout_secs = 30
max_pipeline_size = 1000

# Vector Operations for Redis
[protocols.redis.vector_ops]
default_metric = "cosine"
max_dimensions = 4096
batch_size = 1000
enable_simd = true

[protocols.redis.vector_ops.indexing]
default_algorithm = "hnsw"

[protocols.redis.vector_ops.indexing.hnsw]
m = 16
ef_construction = 200
ef_search = 50

[protocols.redis.vector_ops.indexing.ivf]
nlist = 100
nprobe = 10

# Redis-specific features
[protocols.redis.features]
enable_streams = true         # Redis Streams
enable_pubsub = true         # Pub/Sub messaging
enable_modules = false       # Redis Modules (experimental)
enable_redisearch = true     # RedisSearch compatibility
enable_redisjson = true      # RedisJSON compatibility
enable_redisgraph = true     # RedisGraph compatibility
enable_cluster = false       # Redis Cluster mode

# HTTP REST API Server
[protocols.rest]
enabled = true
port = 8080
max_connections = 1000
request_timeout_secs = 30

# Optional CORS configuration
# [protocols.rest.cors]
# allowed_origins = ["*"]
# allowed_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
# allowed_headers = ["*"]
# max_age_secs = 3600

# Optional rate limiting
# [protocols.rest.rate_limit]
# requests_per_minute = 1000
# burst_capacity = 100

# Cypher (Neo4j-compatible) Server
[protocols.cypher]
enabled = true
port = 7687
max_connections = 1000

[protocols.cypher.graph_engine]
max_query_complexity = 1000
query_timeout_secs = 30
enable_optimization = true
storage_backend = "memory"

# OrbitQL Query Language Server
[protocols.orbitql]
enabled = true
port = 8081
max_connections = 1000
connection_timeout_secs = 30
authentication_enabled = false

# AQL (ArangoDB Query Language) Server
[protocols.aql]
enabled = true
port = 8529
max_connections = 1000
connection_timeout_secs = 30
authentication_enabled = false

# MCP (Model Context Protocol) Server
# [protocols.mcp]
# enabled = false
# port = 8765
# version = "1.0"
# [protocols.mcp.tools]
# available_tools = ["query", "vector_search", "graph_query"]

# ================================
# SECURITY CONFIGURATION
# ================================

[security.authentication]
enabled = false
methods = ["Basic"]

# JWT Configuration
# [security.authentication.jwt]
# secret_key = "your-secret-key"
# expiration_secs = 3600
# algorithm = "HS256"

[security.authorization]
enabled = false
model = "rbac"
default_permissions = ["read", "write"]

# Encryption in Transit
# [security.encryption.in_transit]
# enabled = true
# tls_version = "TLS1.3"
# cipher_suites = ["TLS_AES_256_GCM_SHA384", "TLS_CHACHA20_POLY1305_SHA256"]

# ================================
# PERFORMANCE CONFIGURATION
# ================================

[performance.memory]
max_memory_mb = 4096

[performance.memory.pool_config]
initial_size_mb = 256
max_size_mb = 2048
growth_factor = 1.5

[performance.memory.gc_settings]
auto_gc = true
interval_secs = 300
memory_threshold_pct = 80.0

[performance.io]
max_concurrent_ops = 1000
timeout_secs = 30
buffer_size_kb = 64
enable_direct_io = false

[performance.network]
tcp_nodelay = true
keep_alive = true

[performance.cpu]
# worker_threads = 4  # Defaults to number of CPU cores
enable_affinity = false
enable_simd = true

# ================================
# LOGGING CONFIGURATION
# ================================

[logging]
level = "info"
format = "json"

[[logging.outputs]]
output_type = "stdout"

# File logging with rotation
# [[logging.outputs]]
# output_type = "file"
# file_path = "/var/log/orbit/orbit-server.log"
# [logging.outputs.rotation]
# strategy = "size"
# max_size_mb = 100
# max_files = 10

# Component-specific log levels
[logging.component_levels]
"orbit_protocols" = "info"
"orbit_server" = "info"
"orbit_shared" = "warn"

# ================================
# MONITORING CONFIGURATION
# ================================

[monitoring.metrics]
enabled = true
port = 9090
format = "prometheus"
collection_interval_secs = 30
retention_days = 7

[monitoring.health_checks]
enabled = true
port = 9091
interval_secs = 30
timeout_secs = 5

[monitoring.tracing]
enabled = false
backend = "jaeger"
sampling_rate = 0.1
# endpoint = "http://jaeger:14268/api/traces"

# ================================
# CONNECTION POOLING
# ================================

[pooling]
enabled = true
min_connections = 10
max_connections = 1000
connection_timeout_secs = 30
idle_timeout_secs = 300
max_lifetime_secs = 3600
health_check_interval_secs = 60
load_balancing_strategy = "RoundRobin"
# Pool tier: "Client", "Application", or "Database" (see PoolTier).
tier = "Application"
enable_dynamic_sizing = true
target_utilization = 0.75

[pooling.circuit_breaker]
enabled = true
failure_threshold = 5
failure_window_secs = 60
recovery_timeout_secs = 30
success_threshold = 2
half_open_max_calls = 3

# ================================
# UNIFIED CROSS-PROTOCOL STORAGE
# ================================
# Enables data written via one protocol (Redis, PostgreSQL, MySQL, CQL, Cypher,
# AQL, REST) to be immediately accessible through all other protocols via a
# shared tiered storage layer with automatic data migration.

[unified_storage]
# Enable unified cross-protocol storage
enabled = true
# Data directory for unified storage
data_dir = "./data/unified"

# Hot Tier: In-Memory Storage (fastest access, limited capacity)
[unified_storage.hot_tier]
enabled = true
max_memory_mb = 1024
eviction_policy = "lru"     # Options: "lru", "lfu", "fifo", "ttl"
eviction_threshold = 0.85   # Trigger eviction when 85% full
write_through = true        # Write to warm tier on every write
read_through = true         # Fetch from warm tier on cache miss

[unified_storage.hot_tier.prefetch]
enabled = true
batch_size = 100
trigger_threshold = 3       # Prefetch after 3 accesses to related data

# Warm Tier: RocksDB Storage (persistent, SSD-optimized)
[unified_storage.warm_tier]
enabled = true
data_dir = "./data/unified/rocksdb"
max_disk_gb = 100
enable_compression = true
compression_algorithm = "lz4"  # Options: "lz4", "snappy", "zstd", "none"
block_cache_mb = 256
write_buffer_mb = 64
max_write_buffers = 3
enable_bloom_filters = true
bloom_bits_per_key = 10
enable_wal = true
sync_wal = false

# Cold Tier: Cloud Object Storage (archival, cost-effective)
[unified_storage.cold_tier]
enabled = false              # Enable when cloud storage is configured
backend = "s3"              # Options: "s3", "azure", "gcs", "minio"
data_format = "parquet"     # Options: "parquet", "iceberg", "delta"
partition_strategy = "time" # Options: "time", "hash", "range"
compression = "snappy"

[unified_storage.cold_tier.async_upload]
enabled = true
batch_size_mb = 64
interval_secs = 300         # Upload every 5 minutes
max_concurrent = 4
retry_count = 3

# S3 Configuration (also works for MinIO and S3-compatible services)
# [unified_storage.cold_tier.s3]
# bucket = "orbit-cold-storage"
# region = "us-east-1"
# access_key_id = "your-access-key"
# secret_access_key = "your-secret-key"
# endpoint = "https://s3.amazonaws.com"  # Custom endpoint for MinIO

# Azure Blob Configuration
# [unified_storage.cold_tier.azure]
# account_name = "your-account"
# container_name = "orbit-cold-storage"
# access_key = "your-access-key"

# GCS Configuration
# [unified_storage.cold_tier.gcs]
# bucket = "orbit-cold-storage"
# project_id = "your-project"
# service_account_key = "/path/to/key.json"

# Iceberg Catalog Configuration (required for time travel queries)
# Enable this when using data_format = "iceberg"
# [unified_storage.cold_tier.iceberg]
# catalog_uri = "http://localhost:8181"      # REST catalog URI (required)
# warehouse_path = "s3://bucket/warehouse"   # Custom warehouse path (optional)
# default_namespace = "default"              # Default namespace for tables
# ssl_enabled = false                        # Enable SSL/TLS for catalog
# timeout_seconds = 30                       # Catalog request timeout

# Example: Complete Iceberg setup with MinIO
# 1. Start MinIO: docker run -p 9000:9000 -p 9001:9001 minio/minio server /data --console-address ":9001"
# 2. Start Iceberg REST Catalog: docker run -p 8181:8181 tabulario/iceberg-rest
# 3. Configure:
#    [unified_storage.cold_tier]
#    enabled = true
#    backend = "minio"
#    data_format = "iceberg"
#
#    [unified_storage.cold_tier.s3]
#    bucket = "orbit-warehouse"
#    region = "us-east-1"
#    access_key_id = "minioadmin"
#    secret_access_key = "minioadmin"
#    endpoint = "http://localhost:9000"
#
#    [unified_storage.cold_tier.iceberg]
#    catalog_uri = "http://localhost:8181"
#    default_namespace = "orbit"

# Automatic Tier Migration
[unified_storage.tier_migration]
enabled = true
hot_to_warm_secs = 3600     # Move to warm tier after 1 hour of no access
warm_to_cold_secs = 604800  # Move to cold tier after 7 days
scan_interval_secs = 60     # Check for migrations every minute
batch_size = 1000           # Migrate up to 1000 records per batch
priority_strategy = "age"   # Options: "age", "size", "access_frequency"
enable_promotion = true     # Promote data back to hot tier on access
promotion_threshold = 5     # Promote after 5 accesses

# Cross-Protocol Data Sharing
[unified_storage.cross_protocol]
enabled = true
shared_protocols = ["redis", "postgresql", "mysql", "cql", "cypher", "aql", "rest"]
namespace_strategy = "auto"   # Options: "auto", "explicit"
default_namespace = "default"
enable_schema_inference = true
schema_cache_size = 1000

# TTL and Data Expiration
[unified_storage.ttl]
enabled = true
check_interval_secs = 60
batch_size = 1000
default_ttl_secs = 0        # 0 = no default TTL

# Tier-Aware Actor Placement
# Maps database actor types to storage tiers for optimal performance
[unified_storage.actor_placement]
enabled = true
# Table metadata actors - persist in warm tier
table_actor_tier = "warm"
# Data extent/block actors - persist in warm tier
extent_actor_tier = "warm"
# Column actors for frequently accessed columns - hot tier
column_actor_tier = "hot"
# Active row actors - hot tier for fast access
row_actor_tier = "hot"
# Field-level actors - hot tier
field_actor_tier = "hot"
# Index actors - always hot for fast lookups
index_actor_tier = "hot"
# Enable dynamic migration based on access patterns
dynamic_migration = true
# Promote actor to hot tier after this many accesses
promotion_access_count = 10
# Demote actor after this idle time (seconds)
demotion_idle_secs = 1800   # 30 minutes

# ================================
# CLUSTER CONFIGURATION
# ================================
# Distributed unified storage with replication, sharding, and fault tolerance

[unified_storage.cluster]
# Enable cluster mode for unified storage
enabled = false  # Set to true for multi-node deployments

# Data Replication for Durability
[unified_storage.cluster.replication]
enabled = true
replication_factor = 3              # Number of data copies
strategy = "async"                  # Options: "sync", "async", "semi_sync"
min_ack_replicas = 1               # Replicas required for write ack
max_lag_ms = 1000                  # Max replication lag for async
read_from_replicas = true          # Enable replica reads
replica_selection = "nearest"       # Options: "nearest", "round_robin", "random"

# Data Sharding/Partitioning
[unified_storage.cluster.sharding]
enabled = true
virtual_shards = 256               # Virtual nodes for consistent hashing
strategy = "consistent_hash"       # Options: "consistent_hash", "range", "directory"
# shard_key = "id"                 # Optional: field for automatic sharding
auto_rebalance = true              # Rebalance on node changes
rebalance_threshold = 0.1          # 10% imbalance triggers rebalance
max_concurrent_migrations = 2      # Limit concurrent shard moves

# Node Failure Detection
[unified_storage.cluster.failure_detection]
enabled = true
heartbeat_interval_ms = 1000       # Send heartbeat every second
heartbeat_timeout_ms = 5000        # 5 second timeout
suspect_threshold = 3              # Missed heartbeats before suspect
failure_threshold = 5              # Missed heartbeats before failed

# Gossip Protocol for Distributed Failure Detection
[unified_storage.cluster.failure_detection.gossip]
enabled = true
interval_ms = 500                  # Gossip every 500ms
fanout = 3                         # Gossip to 3 random nodes
suspicion_timeout_ms = 10000       # 10 second suspicion window

# Node Recovery Configuration
[unified_storage.cluster.failure_detection.recovery]
enabled = true
mode = "incremental"               # Options: "full", "incremental", "lazy"
priority = "availability_first"    # Options: "data_first", "availability_first"
max_bandwidth_mbps = 100           # Limit recovery network usage
batch_size = 1000                  # Records per recovery batch
recovery_delay_secs = 30           # Wait before starting recovery

# Data Consistency Settings
[unified_storage.cluster.consistency]
default_level = "eventual"         # Options: "eventual", "strong", "bounded_staleness"
read_consistency = "one"           # Options: "any", "one", "quorum", "all"
write_consistency = "quorum"       # Options: "any", "one", "quorum", "all"
staleness_bound_ms = 5000          # Max staleness for bounded_staleness
read_your_writes = true            # Guarantee read-your-writes
causal_consistency = false         # Enable causal ordering
conflict_resolution = "last_write_wins"  # Options: "last_write_wins", "vector_clock", "custom"

# Node Eviction Configuration
[unified_storage.cluster.eviction]
enabled = true
policy = "auto_unhealthy"          # Options: "manual", "auto_unhealthy", "auto_resource"
resource_threshold = 0.95          # 95% resource usage triggers eviction
grace_period_secs = 60             # Wait before evicting
graceful_shutdown = true           # Drain connections first
drain_timeout_secs = 300           # 5 minute drain timeout
migrate_data_before_eviction = true # Move data before node leaves
blacklist_duration_secs = 300      # Evicted nodes blocked for 5 minutes

# ================================
# FULL-TEXT SEARCH CONFIGURATION
# ================================
# Configure the full-text search engine for protocol FTS operations.
# Two engines are available:
# - "shared": SIMD-accelerated in-memory engine (fastest, recommended for most workloads)
# - "tantivy": Disk-backed Tantivy engine (best for large indexes, durability)

[fts]
# FTS engine type: "shared" (SIMD/in-memory) or "tantivy" (disk-backed)
# - shared: Custom SIMD-accelerated engine with AVX2/NEON tokenization, GPU BM25 scoring
# - tantivy: Lucene-like disk-backed engine with battle-tested implementation
engine = "shared"

# Directory for FTS index storage
index_dir = "./data/fts"

# Maximum memory for indexing (bytes)
max_memory = 104857600  # 100MB

# Number of indexing threads
num_threads = 4

# Default language for text analysis
default_language = "english"

# Enable query caching
enable_cache = true

# Cache size (number of queries)
cache_size = 1000

# BM25 parameters
[fts.bm25]
# k1: Term frequency saturation parameter (typically 1.2-2.0)
k1 = 1.2
# b: Document length normalization (0.0-1.0, higher = more normalization)
b = 0.75

# SharedFtsEngine-specific settings (only used when engine = "shared")
[fts.shared]
# Enable SIMD acceleration for tokenization (AVX2/AVX-512/NEON)
enable_simd = true
# Enable GPU acceleration for BM25 scoring (requires GPU compute feature)
enable_gpu = false
# Enable disk persistence for in-memory indexes
enable_persistence = true
# Auto-flush interval in seconds (0 = manual flush only)
auto_flush_secs = 300

# TantivyFtsEngine-specific settings (only used when engine = "tantivy")
[fts.tantivy]
# Commit interval for batched writes (seconds)
commit_interval_secs = 5
# Enable merge policy optimization
enable_merge_optimization = true

# ================================
# LLM PROVIDERS AND MODEL PROFILES
# ================================
#
# Named, switchable model profiles. Every AI surface (GraphRAG, the RESP LLM.* commands) resolves
# models through this registry, so switching one switches all of them.
#
# Runtime switching needs no restart and no edit to this file:
#   redis-cli LLM.MODELS
#   redis-cli LLM.REGISTER fast ollama llama3.2 TEMPERATURE 0.2
#   redis-cli LLM.USE fast
#   redis-cli LLM.STATS
#
# CREDENTIALS DO NOT BELONG IN THIS FILE (12-factor III). Leave api_key unset and supply it from
# the environment; anything set here is redacted when the config is dumped, but it is still a
# secret checked into a config directory.
#
# Environment variables, in increasing precedence:
#   OPENAI_API_KEY / ANTHROPIC_API_KEY   credential for any profile of that provider lacking one
#   OLLAMA_HOST                          base URL for every Ollama profile
#   ORBIT_LLM_DEFAULT_PROFILE            overrides default_profile below
#   ORBIT_LLM_<PROFILE>_API_KEY          credential for one profile
#   ORBIT_LLM_<PROFILE>_BASE_URL         endpoint for one profile
#   ORBIT_LLM_<PROFILE>_MODEL            model for one profile
# <PROFILE> is the profile name uppercased with '-' and '.' replaced by '_'.
#
# If no [llm] section and no credentials are present, AI features report that no model is
# configured rather than failing inside a query.

[llm]
enabled = false

# Profile used when a request names none. LLM.USE changes this at runtime.
default_profile = "local"

# --- A local Ollama daemon: no credential, no per-token cost ---
[llm.profiles.local]
provider = "ollama"
model = "llama3.2"
embedding_model = "nomic-embed-text"
timeout_ms = 60000

[llm.profiles.local.params]
temperature = 0.3
max_tokens = 2048

# --- Anthropic. Supply ANTHROPIC_API_KEY from the environment. ---
# max_tokens is REQUIRED by the Messages API; there is no server-side default.
# [llm.profiles.claude]
# provider = "anthropic"
# model = "claude-sonnet-4-5"
# fallbacks = ["local"]          # tried in order if this profile fails
# timeout_ms = 45000
#
# [llm.profiles.claude.params]
# temperature = 0.2
# max_tokens = 4096
#
# Prices are per MILLION tokens and are optional. Orbit-RS ships no built-in price table: one
# baked into the binary goes stale silently and then reports confident wrong costs. Without
# this block, LLM.STATS reports tokens but no cost.
# [llm.profiles.claude.pricing]
# prompt_usd_per_million = 3.0
# completion_usd_per_million = 15.0

# --- OpenAI. Supply OPENAI_API_KEY from the environment. ---
# [llm.profiles.gpt]
# provider = "openai"
# model = "gpt-4o-mini"
# embedding_model = "text-embedding-3-small"
# fallbacks = ["local"]
#
# [llm.profiles.gpt.params]
# temperature = 0.3
# max_tokens = 2048

# --- Any OpenAI-compatible endpoint: vLLM, Groq, Together, OpenRouter, LM Studio, DeepSeek,
#     Fireworks. One shape, many services; base_url is required because a compatible server
#     could be anywhere. ---
# [llm.profiles.groq]
# provider = "groq"
# model = "llama-3.3-70b-versatile"
# base_url = "https://api.groq.com/openai/v1"

# --- Azure OpenAI: the deployment name goes in `model`, and api_version is required. ---
# [llm.profiles.azure]
# provider = "azure"
# model = "my-gpt4o-deployment"
# base_url = "https://contoso.openai.azure.com"
# api_version = "2024-10-21"

# Retry and circuit-breaker tuning are per profile and default to sensible values
# (2 retries with jittered exponential backoff; breaker opens after 5 consecutive
# provider-health failures and probes again after 30s).
# [llm.profiles.local.retry]
# max_retries = 2
# initial_backoff_ms = 250
# max_backoff_ms = 8000
# backoff_multiplier_pct = 200
#
# [llm.profiles.local.breaker]
# failure_threshold = 5
# open_duration_ms = 30000
# success_threshold = 2

# ================================
# EXAMPLE USAGE INSTRUCTIONS
# ================================

# Start the server with this configuration:
#   orbit-server --config ./config/orbit-server.toml

# Connect to PostgreSQL:
#   psql -h localhost -p 5432 -U postgres

# Connect to MySQL:
#   mysql -h 127.0.0.1 -P 3306 -u root

# Connect to CQL/Cassandra:
#   cqlsh 127.0.0.1 9042

# Connect to Redis:
#   redis-cli -h localhost -p 6379

# Access REST API:
#   curl http://localhost:8080/api/health

# Connect to Cypher/Neo4j:
#   cypher-shell -a bolt://localhost:7687

# Connect to AQL/ArangoDB:
#   arangosh --server.endpoint tcp://localhost:8529

# Inspect and switch LLM models at runtime:
#   redis-cli LLM.PROVIDERS
#   redis-cli LLM.MODELS
#   redis-cli LLM.USE claude
#   redis-cli LLM.GENERATE "why is the sky blue?"
